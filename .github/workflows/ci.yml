name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GLFW
        run: brew install glfw
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j
      - name: Test
        # --no-tests=error makes a broken test registration fail instead of passing an empty run.
        run: ctest --test-dir build --output-on-failure --no-tests=error

  firmware:
    # macOS because the arduino-cli download and the cache paths below are the macOS ones. The
    # pins below must equal the ones in firmware/build.sh, which stops on any other version.
    runs-on: macos-14
    env:
      ARDUINO_CLI_VERSION: 1.5.1
      STM32_CORE_VERSION: 3.0.0
      U8G2_VERSION: 2.34.22
      STM32_INDEX_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install arduino-cli
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_macOS_ARM64.tar.gz -o "$RUNNER_TEMP/acli.tgz"
          mkdir "$RUNNER_TEMP/acli"
          tar -xzf "$RUNNER_TEMP/acli.tgz" -C "$RUNNER_TEMP/acli"
          echo "$RUNNER_TEMP/acli" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Arduino15
            ~/Documents/Arduino/libraries
          key: arduino-${{ runner.os }}-core${{ env.STM32_CORE_VERSION }}-u8g2${{ env.U8G2_VERSION }}
      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$STM32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32@${STM32_CORE_VERSION}
          arduino-cli lib install U8g2@${U8G2_VERSION}
          arduino-cli core list
          arduino-cli lib list
      - name: Build release image (warn gate and bench-symbol check run inside build.sh)
        # The release build proves the image holds no bench code.
        run: firmware/build.sh
      - name: Build bench image (warn gate and bench-symbol check run inside build.sh)
        # The bench build is the control for that proof: it fails unless it holds every bench function.
        run: BENCH=1 firmware/build.sh
      - name: Check build.sh outcome
        id: images
        # build.sh owns the out dirs, so the workflow asks it. stamp_image.py check reads each .uf2
        # back: block numbering, base address, image header and CRC.
        run: |
          release="$(firmware/build.sh --outdir)"
          bench="$(BENCH=1 firmware/build.sh --outdir)"
          for dir in "$release" "$bench"; do
            for file in cubevox.ino.bin cubevox.uf2 cubevox.ino.elf; do
              test -s "$dir/$file" || { echo "[ERROR] $dir/$file is missing or empty"; exit 1; }
            done
            python3 -I tools/stamp_image.py check "$dir/cubevox.uf2"
          done
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"
      - name: Check the bench symbols on both images
        # build.sh already checks each image against its own variant. This step runs the rule on both
        # elfs and adds the control: the release rule has to flag the bench image, or a renamed
        # function has blinded the list of names.
        env:
          RELEASE_DIR: ${{ steps.images.outputs.release }}
          BENCH_DIR: ${{ steps.images.outputs.bench }}
        run: |
          toolchain="$(firmware/build.sh --toolchain)"
          export NM="$toolchain/arm-none-eabi-nm"
          tools/check_bench_symbols.sh release "$RELEASE_DIR/cubevox.ino.elf"
          tools/check_bench_symbols.sh bench "$BENCH_DIR/cubevox.ino.elf"
          if tools/check_bench_symbols.sh release "$BENCH_DIR/cubevox.ino.elf" >/dev/null; then
            echo "[ERROR] the release rule passed the bench image, so it cannot see bench code"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        # The elf is for the shop: it resolves the addresses in a DIAG.TXT.
        with:
          name: cubevox-firmware-release
          path: |
            ${{ steps.images.outputs.release }}/cubevox.uf2
            ${{ steps.images.outputs.release }}/cubevox.ino.bin
            ${{ steps.images.outputs.release }}/cubevox.ino.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cubevox-firmware-bench
          path: |
            ${{ steps.images.outputs.bench }}/cubevox.uf2
            ${{ steps.images.outputs.bench }}/cubevox.ino.bin
            ${{ steps.images.outputs.bench }}/cubevox.ino.elf
          if-no-files-found: error

  bootloader:
    # The compiler is the xpack toolchain the STM32 core installs, so the setup steps and the pins
    # match the firmware job, and the two jobs share one cache entry because it holds the same files.
    # Keep the pins in sync with the firmware job and with release.yml.
    runs-on: macos-14
    env:
      ARDUINO_CLI_VERSION: 1.5.1
      STM32_CORE_VERSION: 3.0.0
      U8G2_VERSION: 2.34.22
      STM32_INDEX_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_macOS_ARM64.tar.gz -o "$RUNNER_TEMP/acli.tgz"
          mkdir "$RUNNER_TEMP/acli"
          tar -xzf "$RUNNER_TEMP/acli.tgz" -C "$RUNNER_TEMP/acli"
          echo "$RUNNER_TEMP/acli" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Arduino15
            ~/Documents/Arduino/libraries
          key: arduino-${{ runner.os }}-core${{ env.STM32_CORE_VERSION }}-u8g2${{ env.U8G2_VERSION }}
      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$STM32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32@${STM32_CORE_VERSION}
          arduino-cli lib install U8g2@${U8G2_VERSION}
          arduino-cli core list
          arduino-cli lib list
      - name: Build cubevox bootloader
        run: firmware/bootloader/build.sh
      - name: Host selftest
        # A host-only check that the C image check and the DIAG.TXT fields agree with
        # tools/stamp_image.py.
        run: firmware/bootloader/build.sh --selftest
      - name: Check bootloader outcome
        id: bootloaders
        run: |
          cubevox="$(firmware/bootloader/build.sh --outdir)"
          test -s "$cubevox/cubevox-bootloader.bin" || { echo "[ERROR] $cubevox/cubevox-bootloader.bin is missing or empty"; exit 1; }
          echo "cubevox=$cubevox" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: cubevox-bootloader-cubevox
          path: ${{ steps.bootloaders.outputs.cubevox }}/cubevox-bootloader.bin
          if-no-files-found: error
