name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GLFW
        run: brew install glfw
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  firmware:
    # macOS because warn_gate.py treats ~/Library/Arduino15 as the third-party tree.
    runs-on: macos-14
    env:
      ARDUINO_CLI_VERSION: 1.5.1
      STM32_CORE_VERSION: 3.0.0
      U8G2_VERSION: 2.34.22
      STM32_INDEX_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install arduino-cli
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_macOS_ARM64.tar.gz -o "$RUNNER_TEMP/acli.tgz"
          mkdir "$RUNNER_TEMP/acli"
          tar -xzf "$RUNNER_TEMP/acli.tgz" -C "$RUNNER_TEMP/acli"
          echo "$RUNNER_TEMP/acli" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Arduino15
            ~/Documents/Arduino/libraries
          key: arduino-${{ runner.os }}-core${{ env.STM32_CORE_VERSION }}-u8g2${{ env.U8G2_VERSION }}
      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$STM32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32@${STM32_CORE_VERSION}
          arduino-cli lib install U8g2@${U8G2_VERSION}
          arduino-cli core list
          arduino-cli lib list
      - name: Build release image (warn gate runs inside build.sh)
        run: firmware/build.sh
      - name: Build bench image (warn gate runs inside build.sh)
        run: BENCH=1 firmware/build.sh
      - name: Check build.sh outcome
        run: |
          test -s /tmp/cubevox-fw-release/cubevox.ino.bin
          test -s /tmp/cubevox-fw-bench/cubevox.ino.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cubevox-firmware-release
          path: /tmp/cubevox-fw-release/cubevox.ino.bin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: cubevox-firmware-bench
          path: /tmp/cubevox-fw-bench/cubevox.ino.bin
          if-no-files-found: error
