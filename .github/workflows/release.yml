name: release

# A tag vX.YY.ZZ has to equal v plus the text of VERSION.txt, or the run stops with [ERROR]. The
# workflow then builds the release firmware and the cubevox bootloader and attaches three files to
# the release for that tag.
#   cubevox-vX.YY.ZZ.uf2           the file Adam drags onto the CUBEVOX drive
#   cubevox-rom-0x08020000.bin     the same image for the shop's ROM DFU, written at that address
#   cubevox-bootloader-vB.BB.bin   the bootloader for bank 1 sector 0, written over BOOT0 (shop only)
# The rom file starts at the application, which sits above the bootloader's sector. Written at
# 0x08000000 it would destroy the bootloader, so its name carries the address that
# firmware/flash.sh --rom uses.
# The dfu-util and app jobs only prove that the parked Mac app still builds. Nothing from them is
# attached, and publish does not wait for them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  firmware:
    # Same steps as the firmware job in ci.yml. macOS because warn_gate.py treats
    # ~/Library/Arduino15 as the third-party tree. Keep the core pin in sync with ci.yml.
    runs-on: macos-14
    env:
      ARDUINO_CLI_VERSION: 1.5.1
      STM32_CORE_VERSION: 3.0.0
      U8G2_VERSION: 2.34.22
      STM32_INDEX_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Tag matches VERSION.txt
        run: |
          version="v$(cat VERSION.txt)"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "[ERROR] tag $GITHUB_REF_NAME does not match VERSION.txt, which says $version"
            exit 1
          fi
      - name: Install arduino-cli
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_macOS_ARM64.tar.gz -o "$RUNNER_TEMP/acli.tgz"
          mkdir "$RUNNER_TEMP/acli"
          tar -xzf "$RUNNER_TEMP/acli.tgz" -C "$RUNNER_TEMP/acli"
          echo "$RUNNER_TEMP/acli" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Arduino15
            ~/Documents/Arduino/libraries
          key: arduino-${{ runner.os }}-core${{ env.STM32_CORE_VERSION }}-u8g2${{ env.U8G2_VERSION }}
      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$STM32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32@${STM32_CORE_VERSION}
          arduino-cli lib install U8g2@${U8G2_VERSION}
          arduino-cli core list
          arduino-cli lib list
      - name: Build release image (warn gate runs inside build.sh)
        run: firmware/build.sh
      - name: Name the files
        # The rom file is named for the address flash.sh --rom writes it at, which boot_block.h defines.
        run: |
          out="$(firmware/build.sh --outdir)"
          for file in cubevox.ino.bin cubevox.uf2; do
            test -s "$out/$file" || { echo "[ERROR] $out/$file is missing or empty"; exit 1; }
            python3 -I tools/stamp_image.py check "$out/$file"
          done
          start="$(awk '$1 == "#define" && $2 == "CV_APP_START" { sub(/[uUlL]+$/, "", $3); print $3; exit }' firmware/cubevox/src/board/boot_block.h)"
          if ! [[ "$start" =~ ^0x[0-9A-Fa-f]+$ ]]; then
            echo "[ERROR] CV_APP_START is '$start' in boot_block.h; it must look like 0x08020000"
            exit 1
          fi
          mkdir -p assets
          cp "$out/cubevox.uf2" "assets/cubevox-v$(cat VERSION.txt).uf2"
          cp "$out/cubevox.ino.bin" "assets/cubevox-rom-$start.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: cubevox-firmware
          path: assets/*
          if-no-files-found: error

  bootloader:
    # Same toolchain steps as the firmware job: the xpack compiler the STM32 core installs.
    # Keep the core pin in sync with ci.yml.
    runs-on: macos-14
    env:
      ARDUINO_CLI_VERSION: 1.5.1
      STM32_CORE_VERSION: 3.0.0
      U8G2_VERSION: 2.34.22
      STM32_INDEX_URL: https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
    steps:
      - uses: actions/checkout@v4
      - name: Install arduino-cli
        run: |
          curl -fsSL https://downloads.arduino.cc/arduino-cli/arduino-cli_${ARDUINO_CLI_VERSION}_macOS_ARM64.tar.gz -o "$RUNNER_TEMP/acli.tgz"
          mkdir "$RUNNER_TEMP/acli"
          tar -xzf "$RUNNER_TEMP/acli.tgz" -C "$RUNNER_TEMP/acli"
          echo "$RUNNER_TEMP/acli" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Arduino15
            ~/Documents/Arduino/libraries
          key: arduino-${{ runner.os }}-core${{ env.STM32_CORE_VERSION }}-u8g2${{ env.U8G2_VERSION }}
      - name: Install core and libraries
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls "$STM32_INDEX_URL"
          arduino-cli core update-index
          arduino-cli core install STMicroelectronics:stm32@${STM32_CORE_VERSION}
          arduino-cli lib install U8g2@${U8G2_VERSION}
          arduino-cli core list
          arduino-cli lib list
      - name: Build bootloader
        run: firmware/bootloader/build.sh
      - name: Name the file
        # The name carries CV_BOOT_VERSION from board.h. The check reads it back from the built
        # file, because INFO_UF2.TXT on the update drive prints the same string.
        run: |
          out="$(firmware/bootloader/build.sh --outdir)"
          version="$(awk '$1 == "#define" && $2 == "CV_BOOT_VERSION" { gsub(/"/, "", $3); print $3; exit }' firmware/bootloader/boards/cubevox/board.h)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9][0-9]$ ]]; then
            echo "[ERROR] CV_BOOT_VERSION is '$version' in board.h; it must look like 0.01"
            exit 1
          fi
          test -s "$out/cubevox-bootloader.bin" || { echo "[ERROR] $out/cubevox-bootloader.bin is missing or empty"; exit 1; }
          grep -aq "cubevox bootloader v$version" "$out/cubevox-bootloader.bin" || { echo "[ERROR] the built bootloader does not carry 'cubevox bootloader v$version'"; exit 1; }
          mkdir -p assets
          cp "$out/cubevox-bootloader.bin" "assets/cubevox-bootloader-v$version.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: cubevox-bootloader
          path: assets/*
          if-no-files-found: error

  dfu-util:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build static universal dfu-util
        run: app/dfu-util-static.sh "$RUNNER_TEMP/dfu-util"
      - uses: actions/upload-artifact@v4
        with:
          name: dfu-util
          path: ${{ runner.temp }}/dfu-util
          if-no-files-found: error

  app:
    needs: dfu-util
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # bundle.sh stamps `git describe --tags`.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: dfu-util
          path: ${{ runner.temp }}/dfu
      - name: Test
        run: cd app && go vet ./... && go test ./...
      - name: Bundle
        run: |
          chmod +x "$RUNNER_TEMP/dfu/dfu-util"
          DFU_UTIL="$RUNNER_TEMP/dfu/dfu-util" app/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cubevox-app
          path: app/dist/cubevox.app.tar.gz
          if-no-files-found: error

  publish:
    needs: [firmware, bootloader]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: /VERSION.txt
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: cubevox-firmware
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: cubevox-bootloader
          path: assets
      - name: Attach to the release
        run: |
          files=("assets/cubevox-v$(cat VERSION.txt).uf2" assets/cubevox-rom-0x*.bin assets/cubevox-bootloader-v*.bin)
          for file in "${files[@]}"; do
            test -s "$file" || { echo "[ERROR] $file is missing or empty"; exit 1; }
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
